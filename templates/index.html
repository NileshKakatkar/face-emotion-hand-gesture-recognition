{% extends 'main.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Styling for the body */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 16px;
            background: url('your_background_image_url.jpg') center/cover fixed no-repeat;
            background-color:rgb(250, 250, 114);
        }
        
        /* Styling for the container */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            padding: 20px;
            margin-top: 20px;
        }
        
        /* Styling for the section card */
        .section-card {
            flex: 1;
            padding: 20px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: 2px solid #3498db; /* Added border style */
            margin: 10px;
            transition: transform 0.3s;
            overflow: hidden;
        }
        
        /* Hover effect for section card */
        .section-card:hover {
            transform: scale(1.05);
        }
        
        /* Styling for images inside section card */
        .section-card img {
            max-width: 100%;
            height: auto;
            border: 2px solid #3498db;
            border-radius: 10px;
            margin-top: 20px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        /* Hover effect for images */
        .section-card img:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        
        /* Styling for button container */
        .button-container {
            margin-top: 20px;
        }
        
        /* Styling for buttons */
        button {
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            background-color: #3498db;
            color: #fff;
            border: 2px solid #3498db;
            border-radius: 15px;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
            outline: 2px solid #4caf50;
        }
        
        /* Hover effect for buttons */
        button:hover {
            background-color: #007bb5;
            border-color: #007bb5;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }
        
    </style>
</head>

<body>
    <div class="container">
        <!-- Section card for Emotion Detection -->
        <div class="section-card">
            <img src="static/images/emotion_detection.jpg" alt="Emotion Detection Image 1" style="width:300px;height:300px;">
            <div class="button-container">
                <center><a href="{{ url_for('emotion_detection') }}" class="btn btn-warning" style="width: 50%;">Facial Emotion Detection</a></center>
            </div>
        </div>

        <!-- Section card for Hand Gesture Detection -->
        <div class="section-card">
            <img src="static/images/hand_gesture.jpg" alt="Hand Gestures Image 1" style="width:300px;height:300px;">
            <div class="button-container">
                <center><a href="{{ url_for('handgesture') }}" class="btn btn-warning" style="width: 50%;">Hand Gesture Detection</a></center>
            </div>
        </div>
    </div>

</body>

</html>
{% endblock %}
